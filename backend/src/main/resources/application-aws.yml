# Cloud AI through Amazon Bedrock (AI-03, docs/plans/phase-4.md §7, §11). Enabled only explicitly:
#   SPRING_PROFILES_ACTIVE=aws ./mvnw spring-boot:run
# Credentials come from the named AWS CLI profile below (files under ~/.aws, outside the repo). No keys here,
# in .env or anywhere in the repo. The UI shows a banner while this profile is active.
spring:
  ai:
    model:
      chat: bedrock-converse
      embedding: bedrock-titan
    bedrock:
      aws:
        region: us-east-1
        # One call's limit, retries included. Transport retries are the AWS SDK's standard strategy, at most 3
        # attempts, for throttling and 5xx (com.finalysis.ai.bedrock.BedrockClientConfiguration); there is no other
        # retry layer. The SDK's own connection and socket timeouts stay at their defaults.
        timeout: 30s
        profile:
          name: ${FINALYSIS_AWS_PROFILE:finalysis}
      converse:
        chat:
          options:
            # The client's default only: every call names its role's model (finalysis.ai.roles, ChatRoleOptions).
            model: us.anthropic.claude-haiku-4-5-20251001-v1:0
            temperature: 0.0
            max-tokens: 2000
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0
          # Titan's default in Spring AI is IMAGE.
          input-type: TEXT
          # Spring AI builds Titan's Bedrock client itself (no client bean is used), so embedding calls get the SDK's
          # default retries, not the chat client's strategy, and the timeout above. A failed embedding never stops
          # categorization: the items go without examples and the next run embeds them (step 8 notes).

finalysis:
  ai:
    mode: CLOUD
    provider: bedrock
    roles:
      categorization: us.anthropic.claude-haiku-4-5-20251001-v1:0
      # Chat (Phase 6 step 8f): Claude Sonnet 4.6 by default, with finalysis.chat.max-turn-cost 0.15 (application.yml).
      # Budget option: Claude Haiku 4.5 (us.anthropic.claude-haiku-4-5-20251001-v1:0) with max-turn-cost 0.05, about a
      # third of the cost per turn; dev run 4 scored Sonnet 57/58 and Haiku 53/58. Startup refuses a main model whose
      # largest round passes max-turn-cost (Sonnet needs at least 0.0675), so change both together.
      main: us.anthropic.claude-sonnet-4-6
      embedding: amazon.titan-embed-text-v2:0
      vision: ""                                          # Phase 8, local only
    # Dollars per million tokens, for chat's cost limits (docs/plans/phase-6.md §8). The same values as the evaluation's
    # price file (src/test/resources/eval/model-prices.json; ChatPricesTest checks they agree). Check the AWS Bedrock
    # pricing page before relying on an estimate. A main model without a price stops startup while a cost limit is on.
    # Cache prices (step 8c): a cached-prefix read and a 5-minute cache write; without them chat doesn't cache.
    prices:
      "[us.anthropic.claude-sonnet-4-6]":
        input-per-million: 3.00
        output-per-million: 15.00
        cache-read-per-million: 0.30
        cache-write-per-million: 3.75
      "[us.anthropic.claude-haiku-4-5-20251001-v1:0]":
        input-per-million: 1.00
        output-per-million: 5.00
        cache-read-per-million: 0.10
        cache-write-per-million: 1.25
