spring:
  application:
    name: finalysis
  autoconfigure:
    # Phone login uses the vault's own password (docs/plans/phase-8.md §9.3): no user store, no generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Load DB credentials from the repo-root .env (run from backend/ or the repo root).
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  # The plain database (compose.yaml), used only with the vault off (finalysis.vault.enabled=false: development with
  # synthetic data, and the tests). With the vault on, the database is the vault's own cluster, opened on unlock
  # (docs/plans/phase-8.md §4.4, §5.1); the hikari settings below apply to both.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finalysis}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      data-source-properties:
        # Postgres puts row values in error details ("Failing row contains (...)", "Key (x)=(y)").
        # Without them, a logged constraint violation can't carry a description (SEC-10).
        logServerErrorDetail: false
  servlet:
    multipart:
      # Statement uploads (SEC-10). The threshold is above the limit, so an upload is never written
      # to a temporary file: statements stay in memory and are discarded after parsing.
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  web:
    # Problem responses come from ApiExceptionHandler; Boot's fallback /error page must not add
    # exception messages, stack traces or rejected values either (SEC-10).
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  devtools:
    # Devtools (active under spring-boot:run) would otherwise turn on stack traces and messages in
    # error responses and log every resolved exception's message.
    add-properties: false
  # AI is off unless a profile turns it on (AI-03, docs/plans/phase-4.md §7): the model starters create no
  # ChatModel or EmbeddingModel and make no cloud calls. Only application-aws.yml enables them.
  ai:
    model:
      chat: none
      embedding: none
  jpa:
    # Flyway owns the schema. The app starts without a database (locked, docs/plans/phase-8.md §5.1), so Hibernate
    # reads no JDBC metadata at startup and is told the dialect; Flyway and the check that every entity matches the
    # schema (what ddl-auto: validate did) run when the database opens: on unlock, or at startup with the vault off.
    hibernate:
      ddl-auto: none
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
      jakarta.persistence.database-product-name: PostgreSQL
      jakarta.persistence.database-major-version: 17
      jakarta.persistence.database-minor-version: 0
    # No lazy loading outside service transactions.
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      # Only the phone has sessions (the LAN listener, HTTPS); localhost is stateless (§9.3). In memory only.
      tracking-modes: cookie
      cookie:
        name: __Host-finalysis
        secure: true
        http-only: true
        same-site: strict
        path: /
  # Local only (UI-08, docs/plans/phase-7.md §9): nothing else on the network can reach the API. Phone access needs
  # login and HTTPS first (Phase 8).
  address: 127.0.0.1

management:
  health:
    # The database is closed while the vault is locked; health reports the app, not the vault (GET /api/status does).
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        # Health only (SEC-10); its details stay hidden (show-details defaults to never).
        include: health

logging:
  level:
    # PDFBox warns at glyph level ("No glyph for U+0041 ...") and quotes font names and object
    # contents, which leaks statement text one character at a time (SEC-10). Its failures reach the
    # app as exceptions, which PdfTextExtractor maps to fixed messages.
    org.apache.pdfbox: "OFF"
    org.apache.fontbox: "OFF"
    # Model clients (AI-06, SEC-01). Spring AI logs exception messages and output it can't parse at ERROR, and
    # either can echo what was sent; failures are logged by our code with the exception class only, and token
    # counts by AiCallLog. The AWS SDK and its HTTP clients log requests and wire data below WARN.
    org.springframework.ai: "OFF"
    software.amazon.awssdk: WARN
    org.apache.http: WARN
    org.apache.hc: WARN
    io.netty: WARN

finalysis:
  # Phone access (docs/plans/phase-8.md §9): off until turned on in Settings, on one of this computer's private
  # addresses, over HTTPS with a local CA, after login.
  access:
    ui-dir: ../frontend/dist   # the built UI (npm run build) the phone loads
    default-port: 8443
  # The vault (docs/plans/phase-8.md §4, §5): the data lives in an encrypted disk image, opened by a password.
  # enabled=false runs on the plain database above, unlocked from the start (development and tests only).
  vault:
    enabled: ${FINALYSIS_VAULT_ENABLED:true}
    dir: ${FINALYSIS_VAULT_DIR:${user.home}/Library/Application Support/Finalysis/vault}
    pg-bin: /Applications/Postgres.app/Contents/Versions/17/bin  # Postgres.app's PostgreSQL 17 (§4.4)
    db-port: 55432            # the vault's cluster, on 127.0.0.1 only; not 5432, the Docker dev database's
    scripts: ../scripts/vault # run from backend/ (./mvnw spring-boot:run)
    image-size: 50g           # the image's maximum size, set at creation; it grows as needed
    idle-lock-minutes: 15     # until the setting is changed in the app (app_setting vault.idle-lock-minutes)
  ai:
    # OFF here; CLOUD only from application-aws.yml, LOCAL later from application-local.yml.
    mode: OFF
    # The AI stage (docs/plans/phase-4.md §4.5, step 7 notes); used only while a profile turns AI on.
    categorization:
      batch-size: 25          # items (merchant + direction) per call
      max-items-per-run: 500  # cost guard: the rest waits for the next run
      # Answers below it are not applied; their txns go to the review queue. 0.80 from the step 9 dev run: all of
      # its wrong AI answers were at 0.70 to 0.75, and review is preferred over a wrong category (step 9c notes).
      min-confidence: 0.80
      # Off in every profile (no profile file overrides it): with AI on, an import never starts cloud calls by
      # itself; run the AI with POST /api/categorization/run. True runs it in the background after each import.
      run-after-import: false
    # The chat role (docs/plans/phase-6.md §2.3). No temperature unless set here: a 5.5-generation model may refuse one.
    chat:
      # Cache chat's fixed prefix (tool definitions, system prompt, context block; step 8c) for a main model whose
      # price has cache-read-per-million and cache-write-per-million. Never the summary, history, question or results.
      prompt-cache: true
    # Embeddings and similar-merchant examples (CAT-03, docs/plans/phase-4.md §6, step 8 notes).
    embedding:
      dimensions: 1024        # must match merchant_embedding's vector(1024); checked at startup when AI is on
    examples:
      k: 5                    # similar merchants per item at most (0 to 10)
      min-similarity: 0.65    # cosine similarity an example needs; step 9 sets it from the dev set
      max-embeddings-per-run: 500  # cost guard: embedding calls per run; the rest wait for the next run
      direct-assignment: false     # give the nearest example's category without a chat call; step 9 measures it
      direct-min-similarity: 0.97  # how similar that example must be (used only when direct-assignment is on)
      # Distinct examples per call at most; each item's nearest is kept before any item's second. 50 is two per item
      # in a full batch of 25 (k 5 could reach 125). The step 9 eval reports the examples' share of input tokens.
      max-examples-per-batch: 50
  # Chat limits per turn and per day (docs/plans/phase-6.md §8, §18 decision 9); a bad value fails startup. Used only
  # while a profile turns AI on; with AI off a turn is 503 ai-off and nothing is called.
  chat:
    max-rounds: 5                     # model calls per turn: tool rounds, the answer and the grounding retry
    max-tool-calls: 8                 # further calls are not run (SKIPPED_LIMIT) and the model is told to answer
    max-input-tokens-per-call: 12000  # estimated before each call; the turn's oldest tool results are cut first
    max-input-tokens-per-turn: 40000  # reported, summed over the turn
    max-output-tokens: 1500           # per call; an answer cut here is treated as ungrounded
    max-turn-time: 45s                # no round starts after it (each call keeps Bedrock's own 30s timeout)
    max-turn-cost: 0.15               # dollars, estimated from finalysis.ai.prices; 0 turns it off. For the default
                                      # chat model, Sonnet 4.6 (its largest round is $0.07425); 0.05 with the budget
                                      # option, Haiku 4.5 as finalysis.ai.roles.main (application-aws.yml)
    max-daily-cost: 1.00              # dollars per local day over every turn and summary (the usage ledger); 0 turns it off
    retention-days: 90                # a conversation idle this long is deleted, at startup and nightly (1-3650)
    # Meaning-based merchant search (docs/plans/phase-6.md §4). The index is filled by categorization's embedding path
    # after each AI run and on POST /api/chat/search-index/refresh; chat only reads it.
    search:
      min-similarity: 0.40          # cosine similarity a merchant needs to be a candidate by meaning; provisional:
                                    # step 8 tunes it on the dev set only, never on the holdout
      max-embeddings-per-run: 500   # cost guard: embedding calls per index refresh; the rest wait for the next one
  # Read-only analytics (docs/plans/phase-5.md §3.3); a bad value fails startup.
  analytics:
    max-months: 24      # longest from-to range per request: bounds every response
    default-months: 6   # range when from is omitted, ending at to
    merchants:
      max-limit: 50     # longest merchant list per request (default 10)
    # Monthly series (§6.4), shared by the recurring charges list and the two recurring alerts.
    recurring:
      min-gap-days: 25    # a run's charges are 25 to 35 days apart; any other gap ends the run
      max-gap-days: 35
      min-occurrences: 3  # charges a run needs to be a series
      stable-count: 2     # equal charges that make a fixed price
      active-days: 45     # ACTIVE while the last charge is at most this many days before the account's last covered day
      max-limit: 100      # longest recurring list per request (default 50)
  # Rule-based alerts (docs/plans/phase-5.md §6.3); a bad value fails startup. Checked against the synthetic answer key
  # only, so real data may need tuning.
  alerts:
    max-results: 100    # longest alert list per request (and the default limit); truncated beyond it
    category-spike:
      min-increase-percent: 50     # spent >= baseline x 1.5 ...
      min-increase-amount: 100.00  # ... and >= baseline + 100.00
      min-baseline-months: 3       # complete months the trailing 3-month baseline needs
    large-transaction:
      min-amount: 500.00  # a charge must be at least this ...
      times-median: 3     # ... and at least 3 x the median of its category's earlier charges
      history-days: 180   # the days before it that the median covers
      min-history: 5      # charges the median needs, or no alert
    possible-duplicate:
      window-days: 1      # same account, amount and merchant at most this many days apart
    recurring-price-increase:
      min-increase-amount: 0.50  # a series charge at least this above the stable-count equal charges before it
    new-recurring:
      amount-tolerance-percent: 20  # every charge within 20% of the series' median ...
      min-prior-days: 45            # ... the first at least 45 days after the account's first covered day: more than
                                    # max-gap-days, since an older series can first show up a whole gap after it
