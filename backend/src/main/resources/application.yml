spring:
  application:
    name: finalysis
  # Load DB credentials from the repo-root .env (run from backend/ or the repo root).
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finalysis}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  servlet:
    multipart:
      # Statement uploads (SEC-10). The threshold is above the limit, so an upload is never written
      # to a temporary file: statements stay in memory and are discarded after parsing.
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  jpa:
    # Flyway owns the schema; Hibernate only checks that every entity matches it at startup.
    hibernate:
      ddl-auto: validate
    # No lazy loading outside service transactions.
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
