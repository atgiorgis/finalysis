spring:
  application:
    name: finalysis
  # Load DB credentials from the repo-root .env (run from backend/ or the repo root).
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finalysis}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties:
        # Postgres puts row values in error details ("Failing row contains (...)", "Key (x)=(y)").
        # Without them, a logged constraint violation can't carry a description (SEC-10).
        logServerErrorDetail: false
  servlet:
    multipart:
      # Statement uploads (SEC-10). The threshold is above the limit, so an upload is never written
      # to a temporary file: statements stay in memory and are discarded after parsing.
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  web:
    # Problem responses come from ApiExceptionHandler; Boot's fallback /error page must not add
    # exception messages, stack traces or rejected values either (SEC-10).
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  devtools:
    # Devtools (active under spring-boot:run) would otherwise turn on stack traces and messages in
    # error responses and log every resolved exception's message.
    add-properties: false
  # AI is off unless a profile turns it on (AI-03, docs/plans/phase-4.md §7): the model starters create no
  # ChatModel or EmbeddingModel and make no cloud calls. Only application-aws.yml enables them.
  ai:
    model:
      chat: none
      embedding: none
  jpa:
    # Flyway owns the schema; Hibernate only checks that every entity matches it at startup.
    hibernate:
      ddl-auto: validate
    # No lazy loading outside service transactions.
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Health only (SEC-10); its details stay hidden (show-details defaults to never).
        include: health

logging:
  level:
    # PDFBox warns at glyph level ("No glyph for U+0041 ...") and quotes font names and object
    # contents, which leaks statement text one character at a time (SEC-10). Its failures reach the
    # app as exceptions, which PdfTextExtractor maps to fixed messages.
    org.apache.pdfbox: "OFF"
    org.apache.fontbox: "OFF"
    # Model clients (AI-06, SEC-01). Spring AI logs exception messages and output it can't parse at ERROR, and
    # either can echo what was sent; failures are logged by our code with the exception class only, and token
    # counts by AiCallLog. The AWS SDK and its HTTP clients log requests and wire data below WARN.
    org.springframework.ai: "OFF"
    software.amazon.awssdk: WARN
    org.apache.http: WARN
    org.apache.hc: WARN
    io.netty: WARN

finalysis:
  ai:
    # OFF here; CLOUD only from application-aws.yml, LOCAL later from application-local.yml.
    mode: OFF
    # The AI stage (docs/plans/phase-4.md §4.5, step 7 notes); used only while a profile turns AI on.
    categorization:
      batch-size: 25          # items (merchant + direction) per call
      max-items-per-run: 500  # cost guard: the rest waits for the next run
      min-confidence: 0.70    # answers below it are not applied; their txns go to the review queue
      run-after-import: true  # in the background after each import
