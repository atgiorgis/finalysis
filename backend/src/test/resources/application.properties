# Test-only settings, on top of src/main/resources/application.yml (a .properties file in the same
# location wins over the YAML). Never on the spring-boot:run classpath.

# Each cached test context keeps its own pool, all against one Testcontainers Postgres
# (max_connections 100). Ten contexts at Hikari's default of 10 used every connection, so a test
# opening one of its own failed with "too many clients". Three is enough for the lock tests, which
# hold a transaction while another request waits on it.
spring.datasource.hikari.maximum-pool-size=3

# The vault is off in tests (docs/plans/phase-8.md §5.5): the plain Testcontainers database, unlocked from the start.
# The vault's own tests turn it on with fakes for the disk image and the database runtime.
finalysis.vault.enabled=false
