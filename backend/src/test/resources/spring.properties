
# Keep every test context for the whole run (Phase 9 step 9c-10). Spring's default keeps 32 and closes the least
# recently used one beyond that; closing a context stops the shared Testcontainers Postgres (TestcontainersConfiguration)
# under every other context, and each test class after it fails to start. The suite starts 33 at 9c-10.
spring.test.context.cache.maxSize=64
