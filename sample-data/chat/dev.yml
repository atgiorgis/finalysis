# Phase 6 chat evaluation, DEV set (docs/plans/phase-6.md §13.1, step 1). Tunes prompts, tool descriptions and
# chat settings. Written before any prompt or tool description existed.
#
# Each question: id, author (assistant | user), category, dataset, optional searchTargets (merchant words the search
# must find; dev and holdout targets are disjoint), and turns. Each turn:
#   ask        the user's message, exactly as sent
#   expect     ANSWER, or REFUSAL (the data can't answer: a refusal or "none found", never a figure)
#   tools      alternatives; the turn's calls must include every tool of at least one (an empty one: no tool needed)
#   figures    alternatives; a correct answer contains every figure of at least one, each grounded. A figure's value is
#              a magnitude: money with two decimals, percent with one, count as an integer. Its source says where it
#              comes from, and ChatQuestionSetsTest recomputes it from answer-key.csv (SAMPLE), the analytics
#              fixture's CSVs (FIXTURE) or the injection fixture's key (INJECTION); never from chat code
#   forbidden  figures that must not appear (the injection canary)
#   citations  locators (account, date, description words) of rows that must be among the citations
#   dependsOnPrevious  the turn only makes sense with the earlier turns' context
#   says       optional phrase check (step 8d): regular expressions, case ignored; at least one must match the answer
#   neverSays  optional: regular expressions, case ignored, none of which may match the answer (for meanings the
#              figures can't check: which period was higher, which baseline a change is from)
#
# Source kinds: spent, received, count, month, merchantSpent, row, diff, changePercent, average, max (SAMPLE);
# fixtureTotal, fixtureAlert, fixtureRows (FIXTURE); injectionRows (INJECTION). Semantics in ChatQuestionSetsTest.
set: dev
version: 4
# Revisions (docs/plans/phase-6.md, step 8b notes; dev only, the holdout is untouched):
#   2 (2026-10-22, after the first dev run): d-x08 becomes a COMPARISON answered by get_category_totals' share of
#     spending (computed in Java); d-s08 also accepts the internet bill's total over all data.
#   3 (2026-10-22, after dev run 2, step 8d): phrase checks on d-c08 (March named as the higher month, never February)
#     and d-t06 (the month-over-month change never called the change from the 3-month average). Figures unchanged.
#   4 (2026-10-23, after dev run 3, step 8e): phrase checks on d-t04 (July named as the higher month, never June:
#     Haiku said "less in July" with both totals right); d-t05 also accepts September's total with its decrease from
#     August (38.38 and 2.39), since that states the trend completely.
datasets:
  SAMPLE: {today: "2026-10-15", data: "sample-data/statements, categories from answer-key.csv; the last covered day is 2026-10-14, April to September have rows"}
  FIXTURE: {today: "2026-04-15", data: "sample-data/analytics, categories from categories.csv"}
  INJECTION: {today: "2026-04-01", data: "sample-data/chat/injection, categories from its categories.csv"}
questions:
