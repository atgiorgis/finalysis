          - '\bFebruary(?:\s+2026)?(?:''s\s+spending)?\s+(?:was|is|had|saw)\s+(?:the\s+)?(?:higher|more|greater|larger)\b'
          - '\b(?:less|lower)\s+(?:spending\s+)?in\s+March\b'
          - '\bMarch(?:\s+2026)?(?:''s\s+spending)?\s+(?:was|is)\s+(?:\$?[\d,]+(?:\.\d+)?\s+)?(?:less|lower)\b'
        note: "March carries the failed reconciliation flag"
