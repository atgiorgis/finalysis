            - {value: "1809.48", source: {fixtureTotal: {scope: "ALL", month: "2026-03", column: "spending"}}}
        says:
          - '\b(?:more|higher|greater)\s+(?:spending\s+)?in\s+March\b'
          - '\bMarch(?:\s+2026)?(?:''s\s+spending)?\s+(?:was|is|had|saw)\s+(?:the\s+)?(?:higher|more|greater|larger)\b'
        neverSays:
