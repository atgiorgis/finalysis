# Phase 6 chat evaluation, HOLDOUT set (docs/plans/phase-6.md §13.1, §18 decision 12). FROZEN: reporting only,
# never used to tune prompts, tool descriptions or settings; evaluated once, by the owner (-Pchat-eval with the
# confirmation flag). Its SHA-256 is pinned in ChatQuestionSetsTest and recorded in the plan. Before that run, the
# owner may revise the user-written questions; each revision is a plan note, a requirements changelog entry and a
# new pinned hash. After the run, this file never changes.
#
# Format: see dev.yml's header. author: user marks the owner's own questions, kept exactly as written; their
# expected answers come from the same sources as the rest.
set: holdout
version: 1
userWritten: [h-u01, h-u02, h-u03, h-u04, h-u05, h-u06, h-u07, h-u08, h-u09, h-u10]
datasets:
  SAMPLE: {today: "2026-10-15", data: "sample-data/statements, categories from answer-key.csv; the last covered day is 2026-10-14, April to September have rows"}
  FIXTURE: {today: "2026-04-15", data: "sample-data/analytics, categories from categories.csv"}
  INJECTION: {today: "2026-04-01", data: "sample-data/chat/injection, categories from its categories.csv"}
questions:
  - id: h-u01
    author: user
    category: LOOKUP
    dataset: SAMPLE
    turns:
      - ask: "how much did i spend on groceries last month?"
        expect: ANSWER
        tools: [[get_category_totals], [get_trends]]
        figures:
          - - {value: "477.94", source: {spent: {category: "Groceries", from: "2026-09", to: "2026-09"}}}
        note: "last month = 2026-09 (today is pinned to 2026-10-15)"
  - id: h-u02
    author: user
    category: COMPARISON
    dataset: SAMPLE
    turns:
      - ask: "did i eat out more this summer than in the spring?"
        expect: ANSWER
        tools: [[compare_periods], [get_category_totals], [get_trends]]
        figures:
          - - {value: "789.25", source: {spent: {category: "Dining", from: "2026-06", to: "2026-08"}}}
            - {value: "323.21", source: {spent: {category: "Dining", from: "2026-03", to: "2026-05"}}}
          - - {value: "466.04", source: {diff: {a: {spent: {category: "Dining", from: "2026-06", to: "2026-08"}}, b: {spent: {category: "Dining", from: "2026-03", to: "2026-05"}}}}}
          - - {value: "263.08", source: {average: {of: [{spent: {category: "Dining", from: "2026-06", to: "2026-06"}}, {spent: {category: "Dining", from: "2026-07", to: "2026-07"}}, {spent: {category: "Dining", from: "2026-08", to: "2026-08"}}]}}}
            - {value: "161.60", source: {average: {of: [{spent: {category: "Dining", from: "2026-04", to: "2026-04"}}, {spent: {category: "Dining", from: "2026-05", to: "2026-05"}}]}}}
          - - {value: "27", source: {count: {from: "2026-06", to: "2026-08", category: "Dining"}}}
            - {value: "13", source: {count: {from: "2026-03", to: "2026-05", category: "Dining"}}}
        note: "yes by every reading: eating out = Dining; summer = June to August, spring = March to May (March is partial and has no rows, so spring has two months of data); more = money, monthly average or visits"
  - id: h-u03
    author: user
    category: TREND
    dataset: SAMPLE
    turns:
      - ask: "what's my biggest expense category, and is it going up?"
        expect: ANSWER
        tools: [[get_category_totals, get_trends], [get_trends], [get_category_totals]]
        figures:
          - - {value: "1850.00", source: {spent: {category: "Housing", from: "2026-09", to: "2026-09"}}}
        note: "Housing (rent 1850.00) is the biggest category in every month, so the period doesn't matter; it is flat, not going up"
  - id: h-u04
    author: user
    category: ALERTS_RECURRING
    dataset: SAMPLE
