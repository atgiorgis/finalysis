
# --- Finalysis vault (scripts/vault/postgresql.vault.conf, appended by db-init.sh; docs/plans/phase-8.md §4.4) ---
# Loopback TCP only, on a port of its own; no Unix socket.
listen_addresses = '127.0.0.1'
port = @PORT@
unix_socket_directories = ''
password_encryption = scram-sha-256

# Logs stay inside the vault (log/ under the data directory), seven daily files at most, and never carry row values.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_error_verbosity = terse
log_min_error_statement = panic
log_statement = none
log_min_messages = warning
